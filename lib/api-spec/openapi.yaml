openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API do sistema operacional do Spa e Bronze Belém
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: appointments
  - name: clients
  - name: leads
  - name: services
  - name: quotes
  - name: finance
  - name: inventory
  - name: ai-agent
  - name: professionals
  - name: financial-movements
paths:
  /ai-agent/config:
    get:
      operationId: getAiAgentConfig
      tags: [ai-agent]
      summary: Retorna a configuração do agente de atendimento
      responses:
        "200":
          description: AI agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentConfig" }
    put:
      operationId: updateAiAgentConfig
      tags: [ai-agent]
      summary: Salva a configuração do agente de atendimento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentConfig" }
      responses:
        "200":
          description: Updated AI agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentConfig" }
  /ai-agent/test:
    post:
      operationId: testAiAgent
      tags: [ai-agent]
      summary: Testa uma mensagem com a configuração atual do agente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentTestInput" }
      responses:
        "200":
          description: Generated reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentTestResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Resumo operacional do spa
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: Lista a agenda do dia
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Cria um agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentUpdate" }
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted appointment }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Lista clientes unificados
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted client }
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: Lista leads e conversas comerciais
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Adiciona um lead ao funil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Atualiza o estágio de um lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Lista serviços e preços
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted service }
  /packages:
    get:
      operationId: listPackages
      tags: [quotes]
      summary: Lista pacotes disponíveis para orçamentos
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Package" } }
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: Lista orçamentos criados
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/QuoteStatus" } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Salva um orçamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /quotes/{id}:
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted quote }
  /quotes/{id}/send:
    post:
      operationId: sendQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Quote sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteSendResponse" }
  /public/quotes/{token}:
    get:
      operationId: getPublicQuote
      tags: [quotes]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Public quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicQuote" }
  /public/quotes/{token}/approve:
    post:
      operationId: approvePublicQuote
      tags: [quotes]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Approved quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}/cancel:
    post:
      operationId: cancelQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Cancelled quote, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } } }
  /quotes/{id}/duplicate:
    post:
      operationId: duplicateQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "201": { description: Duplicated quote, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } } }
  /quotes/{id}/appointment:
    post:
      operationId: createQuoteAppointment
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuoteAppointmentInput" } } } }
      responses: { "201": { description: Appointment, content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } } }
  /quotes/{id}/payment:
    post:
      operationId: createQuotePayment
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotePaymentInput" } } } }
      responses: { "201": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMovement" } } } } }
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Resumo financeiro
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /finance/movements:
    get:
      operationId: listFinancialMovements
      tags: [financial-movements]
      summary: Lista movimentações financeiras
      parameters:
        - { name: month, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Financial movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FinancialMovement" }
    post:
      operationId: createFinancialMovement
      tags: [financial-movements]
      summary: Cria uma movimentação financeira
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementInput" }
      responses:
        "201":
          description: Created movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
  /finance/movements/{id}:
    patch:
      operationId: updateFinancialMovement
      tags: [financial-movements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementInput" }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
    delete:
      operationId: deleteFinancialMovement
      tags: [financial-movements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted movement }
  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: Lista profissionais e suas comissões
      responses:
        "200":
          description: Professionals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Professional" }
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Cadastra um profissional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "201":
          description: Created professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
  /professionals/{id}:
    patch:
      operationId: updateProfessional
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "200":
          description: Updated professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
    delete:
      operationId: deleteProfessional
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted professional }
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: Lista produtos e posição de estoque importados do backup
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted inventory item }
components:
  schemas:
    AiAgentConfig:
      type: object
      properties:
        active: { type: boolean }
        name: { type: string, minLength: 2 }
        tone: { type: string, enum: [acolhedor, profissional, objetivo] }
        greeting: { type: string }
        objective: { type: string }
        instructions: { type: string }
        businessHours: { type: string }
        address: { type: string }
        paymentMethods: { type: string }
        bookingRules: { type: string }
        policies: { type: string }
        humanHandoff: { type: string }
      required: [active, name, tone, greeting, objective, instructions, businessHours, address, paymentMethods, bookingRules, policies, humanHandoff]
    AiAgentTestInput:
      type: object
      properties:
        message: { type: string, minLength: 1 }
      required: [message]
    AiAgentTestResponse:
      type: object
      properties:
        reply: { type: string }
      required: [reply]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Metric:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        trend: { type: string, enum: [up, down, neutral] }
      required: [label, value, change, trend]
    Dashboard:
      type: object
      properties:
        greeting: { type: string }
        subtitle: { type: string }
        dateLabel: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        serviceMix:
          type: array
          items: { $ref: "#/components/schemas/ServiceMix" }
        currentAppointment:
          anyOf:
            - { $ref: "#/components/schemas/Appointment" }
            - { type: "null" }
      required: [greeting, subtitle, dateLabel, metrics, revenue, serviceMix, currentAppointment]
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
      required: [label, value]
    ServiceMix:
      type: object
      properties:
        service: { type: string }
        value: { type: number }
        color: { type: string }
      required: [service, value, color]
    Appointment:
      type: object
      properties:
        id: { type: integer }
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
        status: { type: string, enum: [confirmed, in_progress, completed, cancelled] }
        avatar: { type: string }
      required: [id, start, end, client, service, professional, room, status, avatar]
    AppointmentInput:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
      required: [start, end, client, service, professional, room]
    AppointmentUpdate:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
        status: { type: string, enum: [confirmed, in_progress, completed, cancelled] }
    Client:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        lastVisit: { type: string }
        service: { type: string }
        status: { type: string, enum: [active, at_risk, new] }
        source: { type: string }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
      required: [id, name, initials, lastVisit, service, status, source, phone, email, notes]
    ClientInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
        service: { type: string }
        status: { type: string, enum: [active, at_risk, new] }
        source: { type: string }
      required: [name, phone, email, notes, service, status, source]
    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        phone: { type: string }
        source: { type: string }
        service: { type: string }
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
        lastMessage: { type: string }
        time: { type: string }
        value: { type: string }
      required: [id, name, initials, phone, source, service, stage, lastMessage, time, value]
    LeadInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        service: { type: string }
        source: { type: string }
      required: [name, phone, service, source]
    LeadUpdate:
      type: object
      properties:
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
      required: [stage]
    Service:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        duration: { type: string }
        price: { type: string }
        accent: { type: string }
      required: [id, name, category, duration, price, accent]
    ServiceInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        duration: { type: string }
        price: { type: string }
        accent: { type: string }
      required: [name, category, duration, price, accent]
    QuoteItem:
      type: object
      properties:
        type: { type: string, enum: [service, package, product, gift_card] }
        refId: { type: integer }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
        professionalId: { type: integer }
        professionalName: { type: string }
        commissionPercent: { type: number }
        estimatedCommission: { type: number }
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        sessions: { type: integer, minimum: 0 }
      required: [type, name, quantity, unitPrice]
    Package:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        sessions: { type: integer }
        serviceId: { type: integer }
      required: [id, name, price, sessions, serviceId]
    QuoteStatus:
      type: string
      enum: [draft, sent, viewed, approved, rejected, expired, cancelled]
    DiscountMode:
      type: string
      enum: [fixed, percent]
    QuoteInput:
      type: object
      properties:
        clientId: { type: integer }
        clientName: { type: string, minLength: 2 }
        phone: { type: string }
        validUntil: { type: string }
        discountMode: { $ref: "#/components/schemas/DiscountMode" }
        discountValue: { type: number, minimum: 0 }
        customerNotes: { type: string }
        internalNotes: { type: string }
        paymentMethods: { type: array, items: { type: string, enum: [pix, credit, debit, cash, boleto] } }
        installments: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuoteItem"
      required: [clientId, clientName, phone, validUntil, discountMode, discountValue, customerNotes, internalNotes, paymentMethods, installments, items]
    Quote:
      allOf:
        - $ref: "#/components/schemas/QuoteInput"
        - type: object
          properties:
            id: { type: integer }
            number: { type: string }
            createdAt: { type: string }
