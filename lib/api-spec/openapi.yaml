openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API do sistema operacional do Spa e Bronze Belém
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: appointments
  - name: clients
  - name: leads
  - name: services
  - name: quotes
  - name: finance
  - name: inventory
  - name: ai-agent
  - name: professionals
  - name: financial-movements
paths:
  /ai-agent/config:
    get:
      operationId: getAiAgentConfig
      tags: [ai-agent]
      summary: Retorna a configuração do agente de atendimento
      responses:
        "200":
          description: AI agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentConfig" }
    put:
      operationId: updateAiAgentConfig
      tags: [ai-agent]
      summary: Salva a configuração do agente de atendimento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentConfig" }
      responses:
        "200":
          description: Updated AI agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentConfig" }
  /ai-agent/test:
    post:
      operationId: testAiAgent
      tags: [ai-agent]
      summary: Testa uma mensagem com a configuração atual do agente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentTestInput" }
      responses:
        "200":
          description: Generated reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentTestResponse" }
  /whatsapp/connection:
    get:
      operationId: getWhatsappConnection
      tags: [ai-agent]
      summary: Verifica a conexão da instância da Evolution API
      responses:
        "200":
          description: WhatsApp connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappConnection" }
  /whatsapp/connect:
    post:
      operationId: connectWhatsapp
      tags: [ai-agent]
      summary: Cria uma instância e gera o QR Code do WhatsApp
      responses:
        "200":
          description: WhatsApp QR Code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappConnectResponse" }
  /whatsapp/automation:
    get:
      operationId: getWhatsappAutomation
      tags: [ai-agent]
      summary: Retorna as automações de agenda do WhatsApp
      responses:
        "200":
          description: WhatsApp automation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappAutomation" }
    put:
      operationId: updateWhatsappAutomation
      tags: [ai-agent]
      summary: Atualiza as automações de agenda do WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappAutomation" }
      responses:
        "200":
          description: Updated WhatsApp automation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappAutomation" }
  /whatsapp/messages:
    get:
      operationId: listWhatsappMessages
      tags: [ai-agent]
      summary: Lista as mensagens enviadas e recebidas pelo agente
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: WhatsApp messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WhatsappMessage" } }
  /whatsapp/conversations:
    get:
      operationId: listWhatsappConversations
      tags: [ai-agent]
      summary: Lista as conversas persistidas do WhatsApp
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: WhatsApp conversations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WhatsappConversation" } }
  /whatsapp/conversations/{phone}:
    patch:
      operationId: updateWhatsappConversation
      tags: [ai-agent]
      summary: Altera o status de uma conversa do WhatsApp
      parameters:
        - { name: phone, in: path, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappConversationUpdate" }
      responses:
        "200":
          description: Updated WhatsApp conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappConversation" }
    delete:
      operationId: deleteWhatsappConversation
      tags: [ai-agent]
      summary: Exclui permanentemente uma conversa do WhatsApp
      parameters:
        - { name: phone, in: path, required: true, schema: { type: string, minLength: 8 } }
      responses:
        "204":
          description: Conversation deleted
  /whatsapp/reply:
    post:
      operationId: sendWhatsappReply
      tags: [ai-agent]
      summary: Envia uma resposta manual para uma conversa do WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappReplyInput" }
      responses:
        "200":
          description: Manual WhatsApp reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappMessage" }
  /whatsapp/documents:
    post:
      operationId: sendWhatsappDocument
      tags: [ai-agent]
      summary: Envia um catálogo em PDF pelo WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappDocumentInput" }
      responses:
        "200":
          description: WhatsApp document delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappMessage" }
  /whatsapp/appointments/{id}/confirmation:
    post:
      operationId: sendWhatsappAppointmentConfirmation
      tags: [ai-agent]
      summary: Envia confirmação manual de um agendamento
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendAppointmentConfirmationResponse" }
  /integrations/evolution/webhook:
    post:
      operationId: receiveEvolutionWebhook
      tags: [ai-agent]
      summary: Recebe eventos de mensagens da Evolution API
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvolutionWebhookPayload" }
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvolutionWebhookResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Resumo operacional do spa
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: Lista a agenda do dia
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Cria um agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentUpdate" }
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted appointment }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Lista clientes unificados
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted client }
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: Lista leads e conversas comerciais
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Adiciona um lead ao funil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Atualiza o estágio de um lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Lista serviços e preços
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted service }
  /packages:
    get:
      operationId: listPackages
      tags: [quotes]
      summary: Lista pacotes disponíveis para orçamentos
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Package" } }
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: Lista orçamentos criados
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/QuoteStatus" } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Salva um orçamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /quotes/{id}:
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted quote }
  /quotes/{id}/send:
    post:
      operationId: sendQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Quote sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteSendResponse" }
  /public/quotes/{token}:
    get:
      operationId: getPublicQuote
      tags: [quotes]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Public quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicQuote" }
  /public/quotes/{token}/approve:
    post:
      operationId: approvePublicQuote
      tags: [quotes]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Approved quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}/cancel:
    post:
      operationId: cancelQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Cancelled quote, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } } }
  /quotes/{id}/duplicate:
    post:
      operationId: duplicateQuote
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "201": { description: Duplicated quote, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } } }
  /quotes/{id}/appointment:
    post:
      operationId: createQuoteAppointment
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuoteAppointmentInput" } } } }
      responses: { "201": { description: Appointment, content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } } }
  /quotes/{id}/payment:
    post:
      operationId: createQuotePayment
      tags: [quotes]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotePaymentInput" } } } }
      responses: { "201": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMovement" } } } } }
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Resumo financeiro
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /finance/movements:
    get:
      operationId: listFinancialMovements
      tags: [financial-movements]
      summary: Lista movimentações financeiras
      parameters:
        - { name: month, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Financial movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FinancialMovement" }
    post:
      operationId: createFinancialMovement
      tags: [financial-movements]
      summary: Cria uma movimentação financeira
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementInput" }
      responses:
        "201":
          description: Created movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
  /finance/movements/{id}:
    patch:
      operationId: updateFinancialMovement
      tags: [financial-movements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementInput" }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
    delete:
      operationId: deleteFinancialMovement
      tags: [financial-movements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted movement }
  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: Lista profissionais e suas comissões
      responses:
        "200":
          description: Professionals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Professional" }
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Cadastra um profissional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "201":
          description: Created professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
  /professionals/{id}:
    patch:
      operationId: updateProfessional
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "200":
          description: Updated professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
    delete:
      operationId: deleteProfessional
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted professional }
  /professionals/{id}/commission-config:
    get:
      operationId: getProfessionalCommissionConfig
      tags: [professionals]
      summary: Retorna a configuração de comissões do profissional
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Commission configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionConfig" }
    put:
      operationId: updateProfessionalCommissionConfig
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionConfigInput" }
      responses:
        "200":
          description: Updated commission configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionConfig" }
  /professionals/{id}/commission-rules:
    get:
      operationId: listCommissionRules
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Service commission rules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommissionRule" } }
    post:
      operationId: createCommissionRule
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionRuleInput" }
      responses:
        "201":
          description: Created commission rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionRule" }
  /professionals/{id}/commission-rules/{ruleId}:
    patch:
      operationId: updateCommissionRule
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ruleId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionRuleInput" }
      responses:
        "200":
          description: Updated commission rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionRule" }
    delete:
      operationId: deleteCommissionRule
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ruleId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted commission rule }
  /commissions/summary:
    get:
      operationId: getCommissionsSummary
      tags: [professionals]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, minLength: 10 } }
        - { name: to, in: query, required: true, schema: { type: string, minLength: 10 } }
        - { name: professionalId, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/CommissionItemStatus" } }
      responses:
        "200":
          description: Commission summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionSummary" }
  /commissions/items:
    get:
      operationId: listCommissionItems
      tags: [professionals]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, minLength: 10 } }
        - { name: to, in: query, required: true, schema: { type: string, minLength: 10 } }
        - { name: professionalId, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/CommissionItemStatus" } }
      responses:
        "200":
          description: Commission items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommissionItem" } }
  /commissions/items/{id}:
    get:
      operationId: getCommissionItem
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Commission item details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionItem" }
  /commissions/closures:
    get:
      operationId: listCommissionClosures
      tags: [professionals]
      parameters:
        - { name: professionalId, in: query, required: false, schema: { type: integer } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/CommissionClosureStatus" } }
      responses:
        "200":
          description: Commission closures
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommissionClosure" } }
  /commissions/closures/close:
    post:
      operationId: closeCommissionPeriod
      tags: [professionals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionClosureInput" }
      responses:
        "200":
          description: Closed commission period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionClosure" }
  /commissions/closures/{id}/reopen:
    post:
      operationId: reopenCommissionPeriod
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reopened commission period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionClosure" }
  /commissions/closures/{id}/pay:
    post:
      operationId: payCommissionPeriod
      tags: [professionals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionPaymentInput" }
      responses:
        "200":
          description: Paid commission period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionClosure" }
  /commissions/audit:
    get:
      operationId: listCommissionAudit
      tags: [professionals]
      parameters:
        - { name: professionalId, in: query, required: false, schema: { type: integer } }
        - { name: closureId, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Commission audit history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommissionAudit" } }
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: Lista produtos e posição de estoque importados do backup
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted inventory item }
components:
  schemas:
    AiAgentConfig:
      type: object
      properties:
        active: { type: boolean }
        name: { type: string, minLength: 2 }
        tone: { type: string, enum: [acolhedor, profissional, objetivo] }
        greeting: { type: string }
        objective: { type: string }
        instructions: { type: string }
        businessHours: { type: string }
        address: { type: string }
        paymentMethods: { type: string }
        bookingRules: { type: string }
        policies: { type: string }
        humanHandoff: { type: string }
      required: [active, name, tone, greeting, objective, instructions, businessHours, address, paymentMethods, bookingRules, policies, humanHandoff]
    AiAgentTestInput:
      type: object
      properties:
        message: { type: string, minLength: 1 }
      required: [message]
    AiAgentTestResponse:
      type: object
      properties:
        reply: { type: string }
      required: [reply]
    WhatsappConnection:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        instance: { type: string }
        state: { type: string }
        message: { type: string }
      required: [configured, connected, instance, state, message]
    WhatsappConnectResponse:
      type: object
      properties:
        created: { type: boolean }
        instance: { type: string }
        connected: { type: boolean }
        state: { type: string }
        message: { type: string }
        qrCode: { type: ["string", "null"] }
        pairingCode: { type: ["string", "null"] }
      required: [created, instance, connected, state, message, qrCode, pairingCode]
    WhatsappAutomation:
      type: object
      properties:
        enabled: { type: boolean }
        aiReplies: { type: boolean }
        humanSupervision: { type: boolean }
        confirmations: { type: boolean }
        reminder24h: { type: boolean }
        reminder2h: { type: boolean }
        timezone: { type: string, minLength: 3 }
      required: [enabled, aiReplies, humanSupervision, confirmations, reminder24h, reminder2h, timezone]
    WhatsappMessage:
      type: object
      properties:
        id: { type: integer }
        direction: { type: string, enum: [inbound, outbound] }
        phone: { type: string }
        clientName: { type: string }
        appointmentId: { type: ["integer", "null"] }
        text: { type: string }
        status: { type: string, enum: [pending, sent, delivered, received, skipped, failed] }
        kind: { type: string, enum: [confirmation, reminder24h, reminder2h, reply, handoff, document] }
        providerMessageId: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, direction, phone, clientName, appointmentId, text, status, kind, providerMessageId, error, createdAt]
    WhatsappConversation:
      type: object
      properties:
        id: { type: integer }
        phone: { type: string }
        clientName: { type: string }
        status: { type: string, enum: [agent, human, closed] }
        lastMessage: { type: string }
        lastMessageAt: { type: string }
        messageCount: { type: integer }
      required: [id, phone, clientName, status, lastMessage, lastMessageAt, messageCount]
    WhatsappConversationUpdate:
      type: object
      properties:
        status: { type: string, enum: [agent, human, closed] }
      required: [status]
    WhatsappReplyInput:
      type: object
      properties:
        phone: { type: string, minLength: 8 }
        clientName: { type: string, minLength: 1 }
        text: { type: string, minLength: 1 }
      required: [phone, clientName, text]
    WhatsappDocumentInput:
      type: object
      properties:
        phone: { type: string, minLength: 8 }
        clientName: { type: string, minLength: 1 }
        document: { type: string, enum: [menu, advanced] }
        caption: { type: string }
      required: [phone, clientName, document, caption]
    SendAppointmentConfirmationResponse:
      type: object
      properties:
        sent: { type: boolean }
        message: { $ref: "#/components/schemas/WhatsappMessage" }
      required: [sent, message]
    EvolutionWebhookResponse:
      type: object
      properties:
        received: { type: boolean }
        action: { type: string }
      required: [received, action]
    EvolutionWebhookPayload:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Metric:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        trend: { type: string, enum: [up, down, neutral] }
      required: [label, value, change, trend]
    Dashboard:
      type: object
      properties:
        greeting: { type: string }
        subtitle: { type: string }
        dateLabel: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        serviceMix:
          type: array
          items: { $ref: "#/components/schemas/ServiceMix" }
        currentAppointment:
          anyOf:
            - { $ref: "#/components/schemas/Appointment" }
            - { type: "null" }
      required: [greeting, subtitle, dateLabel, metrics, revenue, serviceMix, currentAppointment]
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
      required: [label, value]
    ServiceMix:
      type: object
      properties:
        service: { type: string }
        value: { type: number }
        color: { type: string }
      required: [service, value, color]
    Appointment:
      type: object
      properties:
        id: { type: integer }
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
        status: { type: string, enum: [confirmed, in_progress, completed, cancelled] }
        avatar: { type: string }
      required: [id, start, end, client, service, professional, room, status, avatar]
    AppointmentInput:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
      required: [start, end, client, service, professional, room]
    AppointmentUpdate:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
        status: { type: string, enum: [confirmed, in_progress, completed, cancelled] }
    Client:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        lastVisit: { type: string }
        service: { type: string }
        status: { type: string, enum: [active, at_risk, new] }
        source: { type: string }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
      required: [id, name, initials, lastVisit, service, status, source, phone, email, notes]
    ClientInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
        service: { type: string }
        status: { type: string, enum: [active, at_risk, new] }
        source: { type: string }
      required: [name, phone, email, notes, service, status, source]
    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        phone: { type: string }
        source: { type: string }
        service: { type: string }
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
        lastMessage: { type: string }
        time: { type: string }
        value: { type: string }
      required: [id, name, initials, phone, source, service, stage, lastMessage, time, value]
    LeadInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        service: { type: string }
        source: { type: string }
      required: [name, phone, service, source]
    LeadUpdate:
      type: object
      properties:
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
      required: [stage]
    Service:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        duration: { type: string }
        price: { type: string }
        accent: { type: string }
      required: [id, name, category, duration, price, accent]
    ServiceInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string }
        duration: { type: string }
        price: { type: string }
        accent: { type: string }
      required: [name, category, duration, price, accent]
    QuoteItem:
      type: object
      properties:
        type: { type: string, enum: [service, package, product, gift_card] }
        refId: { type: integer }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
        professionalId: { type: integer }
        professionalName: { type: string }
        commissionPercent: { type: number }
        estimatedCommission: { type: number }
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        sessions: { type: integer, minimum: 0 }
      required: [type, name, quantity, unitPrice]
    Package:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        sessions: { type: integer }
        serviceId: { type: integer }
      required: [id, name, price, sessions, serviceId]
    QuoteStatus:
      type: string
      enum: [draft, sent, viewed, approved, rejected, expired, cancelled]
    DiscountMode:
      type: string
      enum: [fixed, percent]
    QuoteInput:
      type: object
      properties:
        clientId: { type: integer }
        clientName: { type: string, minLength: 2 }
        phone: { type: string }
        validUntil: { type: string }
        discountMode: { $ref: "#/components/schemas/DiscountMode" }
        discountValue: { type: number, minimum: 0 }
        customerNotes: { type: string }
        internalNotes: { type: string }
        paymentMethods: { type: array, items: { type: string, enum: [pix, credit, debit, cash, boleto] } }
        installments: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuoteItem"
      required: [clientId, clientName, phone, validUntil, discountMode, discountValue, customerNotes, internalNotes, paymentMethods, installments, items]
    Quote:
      allOf:
        - $ref: "#/components/schemas/QuoteInput"
        - type: object
          properties:
            id: { type: integer }
            number: { type: string }
            createdAt: { type: string }
            status: { $ref: "#/components/schemas/QuoteStatus" }
            publicToken: { type: string }
            sentAt: { type: string }
            viewedAt: { type: string }
            approvedAt: { type: string }
            paidAt: { type: string }
            discount: { type: number }
            subtotal: { type: number }
            total: { type: number }
          required: [id, number, createdAt, status, publicToken, discount, subtotal, total]
    PublicQuote:
      allOf:
        - $ref: "#/components/schemas/Quote"
    QuoteSendResponse:
      type: object
      properties:
        quote: { $ref: "#/components/schemas/Quote" }
        publicPath: { type: string }
        whatsappMessage: { type: string }
        whatsappUrl: { type: string }
      required: [quote, publicPath, whatsappMessage, whatsappUrl]
    QuoteAppointmentInput:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        professionalId: { type: integer }
      required: [start, end]
    QuotePaymentInput:
      type: object
      properties:
        paymentMethod: { type: string, enum: [pix, credit, debit, cash, boleto] }
        amount: { type: number, minimum: 0.01 }
      required: [paymentMethod, amount]
    FinanceSummary:
      type: object
      properties:
        inflow: { type: number }
        outflow: { type: number }
        net: { type: number }
        openAccounts: { type: integer }
        newClients: { type: integer }
        returningClients: { type: integer }
      required: [inflow, outflow, net, openAccounts, newClients, returningClients]
    FinancialMovementInput:
      type: object
      properties:
        type: { type: string, enum: [revenue, expense, receivable] }
        date: { type: string }
        description: { type: string, minLength: 2 }
        category: { type: string }
        amount: { type: number, minimum: 0 }
        status: { type: string, enum: [paid, pending] }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        quoteId: { type: integer }
        paymentMethod: { type: string, enum: [pix, credit, debit, cash, boleto, transfer, card, other] }
        source: { type: string }
        sourceId: { type: integer }
        paymentDate: { type: string }
        paymentNote: { type: string }
      required: [type, date, description, category, amount, status, client, service, professional]
    FinancialMovement:
      allOf:
        - $ref: "#/components/schemas/FinancialMovementInput"
        - type: object
          properties:
            id: { type: integer }
          required: [id]
    ProfessionalInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        specialty: { type: string }
        phone: { type: string }
        email: { type: string }
        commissionRate: { type: number, minimum: 0, maximum: 100 }
        active: { type: boolean }
      required: [name, specialty, phone, email, commissionRate, active]
    Professional:
      allOf:
        - $ref: "#/components/schemas/ProfessionalInput"
        - type: object
          properties:
            id: { type: integer }
          required: [id]
    CommissionType:
      type: string
      enum: [percent, fixed]
    CalculationBase:
      type: string
      enum: [gross, net, paid]
    CommissionRuleInput:
      type: object
      properties:
        serviceId: { type: integer }
        serviceName: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/CommissionType" }
        value: { type: number, minimum: 0 }
        active: { type: boolean }
      required: [serviceId, serviceName, type, value, active]
    CommissionRule:
      allOf:
        - $ref: "#/components/schemas/CommissionRuleInput"
        - type: object
          properties:
            id: { type: integer }
            professionalId: { type: integer }
          required: [id, professionalId]
    CommissionConfigInput:
      type: object
      properties:
        commissionType: { $ref: "#/components/schemas/CommissionType" }
        defaultValue: { type: number, minimum: 0 }
        calculationBase: { $ref: "#/components/schemas/CalculationBase" }
        discountInCalculation: { type: boolean }
        cardFeeInCalculation: { type: boolean }
        cancellationsGenerate: { type: boolean }
        productsGenerate: { type: boolean }
        productCommissionPercent: { type: number, minimum: 0, maximum: 100 }
      required: [commissionType, defaultValue, calculationBase, discountInCalculation, cardFeeInCalculation, cancellationsGenerate, productsGenerate, productCommissionPercent]
    CommissionConfig:
      allOf:
        - $ref: "#/components/schemas/CommissionConfigInput"
        - type: object
          properties:
            professionalId: { type: integer }
            updatedAt: { type: string }
          required: [professionalId, updatedAt]
    CommissionItemStatus:
      type: string
      enum: [eligible, blocked, closed, paid]
    CommissionItem:
      type: object
      properties:
        id: { type: integer }
        appointmentId: { type: integer }
        professionalId: { type: integer }
        professionalName: { type: string }
        serviceId: { type: ["integer", "null"] }
        serviceName: { type: string }
        date: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/CommissionItemStatus" }
        blockedReason: { type: ["string", "null"] }
        baseAmount: { type: ["number", "null"] }
        rateType: { $ref: "#/components/schemas/CommissionType" }
        rateValue: { type: ["number", "null"] }
        commissionAmount: { type: ["number", "null"] }
        calculationBase: { $ref: "#/components/schemas/CalculationBase" }
        snapshot: { type: object, additionalProperties: true }
      required: [id, appointmentId, professionalId, professionalName, serviceId, serviceName, date, status, blockedReason, baseAmount, rateType, rateValue, commissionAmount, calculationBase, snapshot]
    CommissionSummary:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        professionalId: { type: ["integer", "null"] }
        totalAmount: { type: number }
        eligibleAmount: { type: number }
        blockedCount: { type: integer }
        itemCount: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/CommissionItem" } }
      required: [from, to, professionalId, totalAmount, eligibleAmount, blockedCount, itemCount, items]
    CommissionClosureStatus:
      type: string
      enum: [open, closed, paid]
    CommissionClosureInput:
      type: object
      properties:
        professionalId: { type: integer }
        from: { type: string, minLength: 10 }
        to: { type: string, minLength: 10 }
        dueDate: { type: string, minLength: 10 }
      required: [professionalId, from, to, dueDate]
    CommissionPaymentInput:
      type: object
      properties:
        paymentDate: { type: string, minLength: 10 }
        paymentMethod: { type: string, enum: [pix, cash, transfer, card, other] }
        note: { type: string }
      required: [paymentDate, paymentMethod, note]
    CommissionClosure:
      type: object
      properties:
        id: { type: integer }
        professionalId: { type: integer }
        professionalName: { type: string }
        from: { type: string }
        to: { type: string }
        dueDate: { type: string }
        status: { $ref: "#/components/schemas/CommissionClosureStatus" }
        totalAmount: { type: number }
        itemIds: { type: array, items: { type: integer } }
        itemSnapshots: { type: array, items: { $ref: "#/components/schemas/CommissionItem" } }
        financialMovementId: { type: ["integer", "null"] }
        closedAt: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"] }
        paymentDate: { type: ["string", "null"] }
        paymentMethod: { type: ["string", "null"] }
        paymentNote: { type: ["string", "null"] }
      required: [id, professionalId, professionalName, from, to, dueDate, status, totalAmount, itemIds, itemSnapshots, financialMovementId, closedAt, paidAt, paymentDate, paymentMethod, paymentNote]
    CommissionAudit:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, enum: [config, close, reopen, pay] }
        professionalId: { type: integer }
        closureId: { type: ["integer", "null"] }
        username: { type: string }
        timestamp: { type: string }
        before: { type: ["object", "null"], additionalProperties: true }
        after: { type: ["object", "null"], additionalProperties: true }
      required: [id, action, professionalId, closureId, username, timestamp, before, after]
    InventoryItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        brand: { type: string }
        category: { type: string }
        price: { type: number }
        minimumStock: { type: integer }
        stock: { type: integer }
        nextExpiration: { type: string }
        status: { type: string, enum: [ok, low, negative, expired] }
      required: [id, name, brand, category, price, minimumStock, stock, nextExpiration, status]
    InventoryItemInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        brand: { type: string }
        category: { type: string }
        price: { type: number, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        stock: { type: integer }
        nextExpiration: { type: string }
      required: [name, brand, category, price, minimumStock, stock, nextExpiration]