openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API do sistema operacional do Spa e Bronze Belém
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: appointments
  - name: clients
  - name: leads
  - name: services
  - name: finance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Resumo operacional do spa
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: Lista a agenda do dia
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Cria um agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Lista clientes unificados
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: Lista leads e conversas comerciais
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Adiciona um lead ao funil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Atualiza o estágio de um lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Lista serviços e preços
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Resumo financeiro
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Metric:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        trend: { type: string, enum: [up, down, neutral] }
      required: [label, value, change, trend]
    Dashboard:
      type: object
      properties:
        greeting: { type: string }
        subtitle: { type: string }
        dateLabel: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        serviceMix:
          type: array
          items: { $ref: "#/components/schemas/ServiceMix" }
        currentAppointment:
          anyOf:
            - { $ref: "#/components/schemas/Appointment" }
            - { type: "null" }
      required: [greeting, subtitle, dateLabel, metrics, revenue, serviceMix, currentAppointment]
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
      required: [label, value]
    ServiceMix:
      type: object
      properties:
        service: { type: string }
        value: { type: number }
        color: { type: string }
      required: [service, value, color]
    Appointment:
      type: object
      properties:
        id: { type: integer }
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
        status: { type: string, enum: [confirmed, in_progress, completed, cancelled] }
        avatar: { type: string }
      required: [id, start, end, client, service, professional, room, status, avatar]
    AppointmentInput:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        client: { type: string }
        service: { type: string }
        professional: { type: string }
        room: { type: string }
      required: [start, end, client, service, professional, room]
    Client:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        lastVisit: { type: string }
        service: { type: string }
        status: { type: string, enum: [active, at_risk, new] }
        source: { type: string }
      required: [id, name, initials, lastVisit, service, status, source]
    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string }
        phone: { type: string }
        source: { type: string }
        service: { type: string }
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
        lastMessage: { type: string }
        time: { type: string }
        value: { type: string }
      required: [id, name, initials, phone, source, service, stage, lastMessage, time, value]
    LeadInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        service: { type: string }
        source: { type: string }
      required: [name, phone, service, source]
    LeadUpdate:
      type: object
      properties:
        stage: { type: string, enum: [new, contacting, quote, scheduled, converted, lost] }
      required: [stage]
    Service:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        duration: { type: string }
        price: { type: string }
        accent: { type: string }
      required: [id, name, category, duration, price, accent]
    FinanceSummary:
      type: object
      properties:
        inflow: { type: number }
        outflow: { type: number }
        net: { type: number }
        openAccounts: { type: integer }
        newClients: { type: integer }
        returningClients: { type: integer }
      required: [inflow, outflow, net, openAccounts, newClients, returningClients]